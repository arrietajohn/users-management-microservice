services:
  - type: web
    name: users-management-api
    runtime: docker
    plan: free
    # Aiven (MySQL de la guia 2) quedo en DigitalOcean, New Jersey: Virginia es la region de Render mas cercana
    region: virginia
    branch: main
    # Despliega solo cuando la CI de GitHub Actions (.github/workflows/ci.yml) termina en verde
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: crud_usuarios
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_ADDRESS
        sync: false
      - key: SMTP_FROM_NAME
        value: Gestion de Usuarios
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_SECONDS
        value: "900"

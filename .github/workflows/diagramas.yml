name: Publicar diagramas

on:
  push:
    branches: [main]
    paths:
      - '.diagramas/arquitectura/**'
      - '.github/workflows/diagramas.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Preparar diagramas
        run: |
          mkdir -p _sitio
          cp .diagramas/arquitectura/*.html _sitio/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _sitio
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
